name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: git ls-files -z '*.cpp' '*.h' | xargs -0 -r pipx run --spec clang-format==23.1.3 clang-format --dry-run --Werror

  core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - { os: windows-latest, args: -A Win32 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMEMORIA_BUILD_PLUGIN=OFF -DMEMORIA_BUILD_TESTS=ON ${{ matrix.args }}
      - run: cmake --build build --config Release --parallel 4 --target memoria_core_tests
      - run: ctest --test-dir build -C Release --output-on-failure --no-tests=error

  plugin:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - run: |
          sdk="${RUNNER_TEMP//\//}/ashita"
          git clone -q --filter=blob:none --no-checkout --depth 1 --branch v4.3.1.1 https://github.com/AshitaXI/Ashita-v4beta.git "$sdk"
          git -C "$sdk" sparse-checkout set plugins/sdk
          git -C "$sdk" checkout -q
          echo "ASHITA4_SDK_PATH=$sdk/plugins/sdk" >> "$GITHUB_ENV"
      - run: cmake -S . -B build -A Win32 -DMEMORIA_BUILD_PLUGIN=ON -DMEMORIA_BUILD_TESTS=OFF -DMEMORIA_OUTPUT_DIR="${GITHUB_WORKSPACE//\//}/out"
      - run: cmake --build build --config Release --parallel --target memoria
      - uses: actions/upload-artifact@v7
        with:
          name: memoria
          path: out/Release/Memoria.dll
          if-no-files-found: error
