name: release

# A v<version> tag publishes a GitHub release with Memoria.dll; v<version>-<suffix>, such as v0.6.0-rc.1, a pre-release.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit

  publish:
    needs: build
    runs-on: [self-hosted, lsb]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: memoria
          path: out
      - name: Check the tag names the built version
        run: |
          version="${GITHUB_REF_NAME#v}"
          base="${version%%-*}"
          suffix="${version#"$base"}"
          grep -q "project(memoria VERSION ${base} " CMakeLists.txt && grep -q "set(MEMORIA_PRERELEASE \"${suffix#-}\")" CMakeLists.txt || { echo "tag $GITHUB_REF_NAME does not match CMakeLists.txt" >&2; exit 1; }
      - name: Checksum
        id: sum
        run: echo "sha256=$(sha256sum out/Memoria.dll | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      # lsb has no gh CLI, so the release goes through the API with this action.
      - uses: softprops/action-gh-release@v2
        with:
          files: out/Memoria.dll
          body: SHA-256 ${{ steps.sum.outputs.sha256 }}
          prerelease: ${{ contains(github.ref_name, '-') }}
