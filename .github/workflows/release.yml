name: release

# A v<version> tag publishes a GitHub release with Memoria.dll.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    permissions:
      contents: write
    uses: sruon/Ashita4-plugin-ci/.github/workflows/build-plugin.yml@v1.1
    with:
      targets: memoria
      output-dir-variable: MEMORIA_OUTPUT_DIR
      cmake-args: -DMEMORIA_BUILD_TESTS=OFF
      private-owner: ffxi-dev
    secrets:
      ssh-key: ${{ secrets.XICAP_DEPLOY_KEY }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: memoria
          path: out
      - name: Check the tag names the built version
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "project(memoria VERSION ${version} " CMakeLists.txt || { echo "tag $GITHUB_REF_NAME does not match CMakeLists.txt" >&2; exit 1; }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256=$(sha256sum out/Memoria.dll | cut -d' ' -f1)
          gh release create "$GITHUB_REF_NAME" out/Memoria.dll --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "SHA-256 $sha256"
