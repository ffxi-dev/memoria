name: build

# Builds Memoria.dll with MSVC for 32-bit Windows; release.yml calls this too.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check formatting
        run: git ls-files -z '*.c' '*.cc' '*.cpp' '*.h' '*.hpp' | xargs -0 -r pipx run --spec clang-format==23.1.3 clang-format --dry-run --Werror

  plugin:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the Ashita SDK
        run: |
          sdk="${RUNNER_TEMP//\//}/ashita"
          git clone -q --filter=blob:none --no-checkout --depth 1 --branch v4.3.1.1 https://github.com/AshitaXI/Ashita-v4beta.git "$sdk"
          git -C "$sdk" sparse-checkout set plugins/sdk
          git -C "$sdk" checkout -q
          echo "ASHITA4_SDK_PATH=$sdk/plugins/sdk" >> "$GITHUB_ENV"
      # Fetches the private xicap; does nothing without the secret, and can go once xicap is public.
      - name: Use the xicap deploy key
        env:
          KEY: ${{ secrets.XICAP_DEPLOY_KEY }}
        run: |
          [ -n "$KEY" ] || exit 0
          key="${RUNNER_TEMP//\//}/xicap_key"
          printf '%s\n' "$KEY" > "$key"
          chmod 600 "$key"
          {
            echo "GIT_SSH_COMMAND=ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
            echo "GIT_CONFIG_COUNT=1"
            echo "GIT_CONFIG_KEY_0=url.git@github.com:ffxi-dev/xicap.insteadOf"
            echo "GIT_CONFIG_VALUE_0=https://github.com/ffxi-dev/xicap"
          } >> "$GITHUB_ENV"
      - run: cmake -S . -B build -A Win32 -DMEMORIA_BUILD_PLUGIN=ON -DMEMORIA_BUILD_TESTS=OFF -DMEMORIA_OUTPUT_DIR="${GITHUB_WORKSPACE//\//}/out"
      - run: cmake --build build --config Release --parallel --target memoria
      - uses: actions/upload-artifact@v7
        with:
          name: memoria
          path: out/Release/Memoria.dll
          if-no-files-found: error
