name: build

# Builds Memoria.dll on lsb with clang-cl in vault's vault-msvc image (ffxi-dev/vault msvc/); release.yml calls this too.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  format:
    runs-on: [self-hosted, lsb]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check formatting
        env:
          PYTHONNOUSERSITE: "1"
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q clang-format==22.1.4
          git ls-files -z '*.c' '*.cc' '*.cpp' '*.h' '*.hpp' | xargs -0 -r "$RUNNER_TEMP/venv/bin/clang-format" --dry-run --Werror

  plugin:
    runs-on: [self-hosted, lsb]
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the Ashita SDK
        run: |
          sdk="$RUNNER_TEMP/ashita"
          git clone -q --filter=blob:none --no-checkout --depth 1 --branch v4.3.1.1 https://github.com/AshitaXI/Ashita-v4beta.git "$sdk"
          git -C "$sdk" sparse-checkout set plugins/sdk
          git -C "$sdk" checkout -q
          echo "ASHITA4_SDK_PATH=$sdk/plugins/sdk" >> "$GITHUB_ENV"
      - uses: ffxi-dev/vault/.github/actions/deploy-key@ci/v1.12
        with:
          key: ${{ secrets.XICAP_DEPLOY_KEY }}
      - uses: ffxi-dev/vault/.github/actions/msvc@ci/v1.12
        with:
          env: ASHITA4_SDK_PATH
          run: |
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMEMORIA_BUILD_PLUGIN=ON -DMEMORIA_BUILD_TESTS=OFF -DMEMORIA_OUTPUT_DIR="$PWD/out"
            cmake --build build --target memoria MemoriaProbe MemoriaProbeOld
      - uses: actions/upload-artifact@v4
        with:
          name: memoria
          path: out/Memoria.dll
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: memoria-probe
          path: |
            out/MemoriaProbe.dll
            out/MemoriaProbeOld.dll
          if-no-files-found: error
