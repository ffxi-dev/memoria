schema: spec-driven

context: |
  Memoria is an Ashita v4 plugin: it records retail sessions to xicap and uploads them to Mogsafe.
  Changes that touch only Memoria start here. Repository rules live in README.md, under Contributing.

rules:
  design:
    - Record implementation deviations under Implementation Notes with the reason and revisit trigger
  tasks:
    - Check a task only when implemented and verified by a test or recorded run
